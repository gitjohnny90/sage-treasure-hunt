<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5C7A3A">
  <title>Ranger Sage's Treasure Hunt — Camp Gunnison</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sage's Hunt">

  <!-- Fonts are self-hosted so the look survives offline / weak signal. -->
  <link rel="stylesheet" href="fonts/fonts.css?v=2026-07-02a">
  <link rel="stylesheet" href="styles.css?v=2026-07-02a">
</head>
<body>
  <div id="device-frame">
    <div id="app" role="main">
      <noscript>This treasure hunt needs JavaScript turned on.</noscript>
    </div>
    <div id="toast-host" role="status" aria-live="polite"></div>
    <div id="confetti-host" aria-hidden="true"></div>
    <button id="menu-btn" type="button" aria-label="Menu" aria-controls="menu-panel" aria-expanded="false">☰</button>
    <div id="menu-panel" hidden>
      <button class="menu-item" data-action="map">Back to map</button>
      <button class="menu-item" data-action="reset">Start over</button>
      <button class="menu-item" data-action="close">Close</button>
    </div>
  </div>

  <script src="jsQR.min.js?v=2026-07-02a"></script>
  <script src="qr-scanner.js?v=2026-07-02a"></script>
  <script src="data.js?v=2026-07-02a"></script>
  <script src="app.js?v=2026-07-02a"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW register failed:", err));
      });
    }
  </script>
</body>
</html>
